<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FastAPI 画像取得テスト</title>
    <style>
        body { font-family: sans-serif; }
        #image-container { 
            margin-top: 20px;
            min-height: 200px;
            width: 300px;
            border: 2px dashed #ccc;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img { max-width: 100%; max-height: 100%; }
        p { color: red; font-weight: bold; }
        button { margin-right: 10px; padding: 8px 12px; }
    </style>
</head>
<body>

    <h1>画像API 取得テスト</h1>

    <button id="fetch-dog-btn">dog.jpg を取得 (成功例)</button>
    <button id="fetch-fox-btn">fox.png を取得 (失敗例)</button>

    <div id="image-container">
        </div>

    <script>
        const dogBtn = document.getElementById('fetch-dog-btn');
        const foxBtn = document.getElementById('fetch-fox-btn');
        const imageContainer = document.getElementById('image-container');

        // dog.jpgを取得するイベント
        dogBtn.addEventListener('click', () => {
            fetchAndDisplayImage('dog.JPG');
        });

        // 存在しないfox.pngを取得するイベント
        foxBtn.addEventListener('click', () => {
            fetchAndDisplayImage('fox.png');
        });

        // 画像を取得して表示する関数
        async function fetchAndDisplayImage(filename) {
            // コンテナを空にする
            imageContainer.innerHTML = '';

            try {
                const response = await fetch(`http://127.0.0.1:8000/images/${filename}`);

                // レスポンスが成功(200 OKなど)かチェック
                if (response.ok) {
                    // レスポンスをBlob(バイナリデータ)として取得
                    const imageBlob = await response.blob();
                    
                    // Blobから画像を表示するためのURLを生成
                    const imageUrl = URL.createObjectURL(imageBlob);
                    
                    // img要素を作成してコンテナに追加
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    imageContainer.appendChild(img);

                } else {
                    // 404 Not Foundなどのエラーの場合
                    const p = document.createElement('p');
                    p.textContent = `エラー: ${response.status} ${response.statusText} (ファイルが見つかりません)`;
                    imageContainer.appendChild(p);
                }
            } catch (error) {
                // ネットワークエラーなど
                const p = document.createElement('p');
                p.textContent = `通信エラーが発生しました: ${error}`;
                imageContainer.appendChild(p);
            }
        }
    </script>
</body>
</html>
